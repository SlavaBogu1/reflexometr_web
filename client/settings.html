<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="settings.title">Settings</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    /* CR-UI-20: per-device-type group icons within the merged "Input devices" card. */
    .device-icon {
      width: 1.4rem; height: 1.4rem; flex: none;
      display: inline-flex; align-items: center; justify-content: center;
      color: var(--color-text-dim);
    }
    .device-icon svg { width: 100%; height: 100%; }
    .device-group-heading { display: flex; align-items: center; gap: 0.75rem; margin-bottom: 0.5rem; }
    .device-group-heading:not(:first-child) { margin-top: 1.25rem; }
    .device-group-heading h3 { margin: 0; font-size: 1rem; }
    .device-subitem { padding-left: 2.15rem; }

    /* CR-AUTH-03 (reopened): per-field checkmark save button for the User
       name / Display name text inputs. Layout approved:
       prototype-settings-namefields-savebutton.html. */
    .field-input-row { display: flex; align-items: center; gap: 0.4rem; }
    .save-btn {
      display: inline-flex; align-items: center; justify-content: center;
      width: 2.1rem; height: 2.1rem; flex: 0 0 auto;
      background: var(--color-surface-alt); border: 1px solid var(--color-border);
      border-radius: 6px; color: var(--color-text-dim); cursor: pointer; padding: 0;
    }
    .save-btn svg { width: 1.1rem; height: 1.1rem; }
    .save-btn:disabled { opacity: 0.45; cursor: not-allowed; }
    .save-btn.enabled { color: var(--color-accent); border-color: var(--color-accent-dim); cursor: pointer; opacity: 1; }
    .save-btn.enabled:hover { background: var(--color-accent); color: #05201d; }
  </style>
</head>
<body>
  <div id="site-nav"></div>

  <main class="container">
    <h1 data-i18n="settings.title">Settings</h1>
    <p class="notice info" data-i18n="settings.intro"></p>
    <div id="settings-error" class="notice danger" role="alert" style="display:none;"></div>

    <!-- CR-UI-20: "Two-hand mapping" merged into "Input devices"; icon-led groups
         (Keyboard/Gamepad/Mouse), Keyboard group holds all 3 keyboard-related
         bindings together. Layout approved: prototype-settings-devices-merge.html. -->
    <div class="card">
      <h2 data-i18n="settings.section.devices">Input devices</h2>

      <div class="device-group-heading">
        <div class="device-icon" title="Keyboard">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <rect x="2" y="5" width="20" height="14" rx="2"/>
            <path d="M5 9h1.4M8.3 9h1.4M11.6 9h1.4M14.9 9h1.4M18.2 9h1.4
                     M5 12h1.4M8.3 12h1.4M11.6 12h1.4M14.9 12h1.4M18.2 12h1.4
                     M7 15.5h10"/>
          </svg>
        </div>
        <h3 data-i18n="settings.group.keyboard">Keyboard</h3>
      </div>

      <div class="field-row device-subitem">
        <div>
          <label data-i18n="settings.keyboard.label">Single-key (one-hand tests)</label>
          <div class="field-desc" data-i18n="settings.keyboard.desc"></div>
        </div>
        <div class="btn-row" style="margin-top:0;">
          <span id="keyboard-value" class="chip"></span>
          <button class="btn secondary" id="btn-rebind-keyboard" data-i18n="common.change">Change</button>
        </div>
      </div>

      <div class="field-row device-subitem">
        <div>
          <label data-i18n="settings.lefthand.label">Left-hand key</label>
          <div class="field-desc" data-i18n="settings.lefthand.desc"></div>
        </div>
        <div class="btn-row" style="margin-top:0;">
          <span id="lefthand-value" class="chip"></span>
          <button class="btn secondary" id="btn-rebind-left" data-i18n="common.change">Change</button>
        </div>
      </div>

      <div class="field-row device-subitem">
        <div>
          <label data-i18n="settings.righthand.label">Right-hand key</label>
          <div class="field-desc" data-i18n="settings.righthand.desc"></div>
        </div>
        <div class="btn-row" style="margin-top:0;">
          <span id="righthand-value" class="chip"></span>
          <button class="btn secondary" id="btn-rebind-right" data-i18n="common.change">Change</button>
        </div>
      </div>

      <div class="device-group-heading">
        <div class="device-icon" title="Gamepad">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
            <path d="M6 9h12l2 7a2 2 0 0 1-3.4 1.4L14 15h-4l-2.6 2.4A2 2 0 0 1 4 16z"/>
            <path d="M8 11v3M6.5 12.5h3"/>
            <circle cx="16" cy="11" r="0.8" fill="currentColor"/>
            <circle cx="18" cy="13" r="0.8" fill="currentColor"/>
          </svg>
        </div>
        <h3 data-i18n="settings.group.gamepad">Gamepad</h3>
      </div>

      <div class="field-row device-subitem">
        <div>
          <label data-i18n="settings.gamepad.label">Gamepad button</label>
          <div class="field-desc" data-i18n="settings.gamepad.desc"></div>
        </div>
        <div class="btn-row" style="margin-top:0;">
          <span id="gamepad-value" class="chip"></span>
          <button class="btn secondary" id="btn-rebind-gamepad" data-i18n="common.change">Change</button>
        </div>
      </div>

      <div class="device-group-heading">
        <div class="device-icon" title="Mouse">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
            <rect x="7" y="3" width="10" height="18" rx="5"/>
            <path d="M12 3v6"/>
          </svg>
        </div>
        <h3 data-i18n="settings.group.mouse">Mouse</h3>
      </div>

      <div class="field-row device-subitem">
        <div>
          <label data-i18n="settings.mouse.label">Mouse</label>
          <div class="field-desc" data-i18n="settings.mouse.desc"></div>
        </div>
        <span class="chip" data-i18n="settings.mouse.value">Left-click (fixed)</span>
      </div>

      <!-- CR-UI-16: pre-start countdown field — same field-row pattern as the rows
           above, a number input instead of chip+button since there is no "rebind"
           action, just a value. Ungrouped (not device-specific). -->
      <div class="field-row">
        <div>
          <label data-i18n="settings.countdown.label">Pre-start countdown (seconds)</label>
          <div class="field-desc" data-i18n="settings.countdown.desc"></div>
        </div>
        <div class="btn-row" style="margin-top:0;">
          <input type="number" id="countdown-seconds" min="0" max="10" style="width:4.5rem;">
        </div>
      </div>
    </div>

    <!-- CR-UI-19: "Language" merged into "Profile"; sync-status note moved to a
         plain sub-heading line under the title (was a bordered notice box).
         Layout approved: prototype-settings-profile-merge.html. -->
    <div class="card">
      <h2 data-i18n="settings.section.profile">Profile</h2>
      <p class="field-desc" id="login-note" data-i18n="settings.login_note" style="margin-top:-0.5rem; margin-bottom:1rem;"></p>

      <div class="field-row">
        <div>
          <label data-i18n="settings.dominant.label">Dominant hand</label>
          <div class="field-desc" data-i18n="settings.dominant.desc"></div>
        </div>
        <select id="dominant-hand-select">
          <option value="" data-i18n="settings.dominant.unset">Not set</option>
          <option value="left" data-i18n="settings.dominant.left">Left</option>
          <option value="right" data-i18n="settings.dominant.right">Right</option>
          <option value="none-recorded" data-i18n="settings.dominant.none">No preference</option>
        </select>
      </div>

      <!-- CR-AUTH-03: optional profile fields, server-backed only (no anonymous
           local-first fallback like dominant-hand/language above — these have no
           meaning without a logged-in account).
           Reopened 2026-09-18: replaced change-event auto-save (missed on
           navigate-away-without-blur) with an explicit per-field checkmark save
           button — disabled by default/at baseline, enabled while the field
           differs from its last-saved value. Layout approved:
           prototype-settings-namefields-savebutton.html. -->
      <div class="field-row">
        <div>
          <label data-i18n="settings.realname.label">User name</label>
          <div class="field-desc" data-i18n="settings.realname.desc"></div>
        </div>
        <div class="field-input-row">
          <input type="text" id="realname-input" maxlength="100">
          <button type="button" class="save-btn" id="realname-save" disabled
                  data-i18n-attr="aria-label:settings.savefield.label;title:settings.savefield.label">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M4 12l5 5L20 6"/>
            </svg>
          </button>
        </div>
      </div>

      <div class="field-row">
        <div>
          <label data-i18n="settings.displayname.label">Display name</label>
          <div class="field-desc" data-i18n="settings.displayname.desc"></div>
        </div>
        <div class="field-input-row">
          <input type="text" id="displayname-input" maxlength="100">
          <button type="button" class="save-btn" id="displayname-save" disabled
                  data-i18n-attr="aria-label:settings.savefield.label;title:settings.savefield.label">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M4 12l5 5L20 6"/>
            </svg>
          </button>
        </div>
      </div>

      <div class="field-row">
        <div>
          <label data-i18n="settings.language.label">Language</label>
          <div class="field-desc" data-i18n="settings.language.desc"></div>
        </div>
        <select id="language-select"></select>
      </div>
    </div>

    <div class="btn-row">
      <button class="btn secondary" id="btn-reset" data-i18n="settings.reset">Reset to defaults</button>
      <span id="saved-flag" class="notice info" style="display:none;" data-i18n="settings.saved"></span>
    </div>
  </main>

  <script src="js/util.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/locales/en.js"></script>
  <script src="js/locales/es.js"></script>
  <script src="js/locales/de.js"></script>
  <script src="js/locales/fr.js"></script>
  <script src="js/locales/zh-Hans.js"></script>
  <script src="js/locales/ru.js"></script>
  <script src="js/settings.js"></script>
  <script src="js/session.js"></script>
  <script src="js/api.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/settings-page.js"></script>
</body>
</html>
