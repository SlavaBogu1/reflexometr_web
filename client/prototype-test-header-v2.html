<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Test page — CR mockup v2 (shorter objective, color swatches, in-stage trial counter, bigger orb)</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .color-swatch {
      display: inline-block; width: 0.9em; height: 0.9em; border-radius: 3px;
      vertical-align: middle; margin: 0 0.15em;
    }
  </style>
</head>
<body>
  <div id="site-nav"></div>

  <main class="container">

    <section class="page active" id="page-test">

      <!-- CR-UI-15 header, updated: shorter Objective text (new header-only key,
           Description page keeps its fuller original wording), color swatches
           added next to the Stimulus bullet's "green"/"red" words. -->
      <div class="card" id="test-header" style="margin-bottom: 1rem;">
        <ul id="test-header-facts" style="margin: 0; padding-left: 1.1rem; font-size: 0.9rem; color: var(--color-text-dim); line-height: 1.6;">
          <li><strong style="color: var(--color-text);">Objective:</strong> Measuring each hand's reaction speed and the gap between them.</li>
          <li><strong style="color: var(--color-text);">Stimulus:</strong> The shared stimulus changes color from
            <span class="color-swatch" style="background: var(--stimulus-green);"></span>green
            to
            <span class="color-swatch" style="background: var(--stimulus-red);"></span>red.
          </li>
          <li>
            <span style="display: inline-flex; align-items: center; gap: 1.5rem; flex-wrap: wrap;">
              <span><strong style="color: var(--color-text);">Input devices:</strong> Left hand key: A · Right hand key: L</span>
              <a href="settings.html" class="btn secondary" style="padding: 0.15rem 0.6rem; font-size: 0.8rem; white-space: nowrap;">Settings</a>
            </span>
          </li>
        </ul>
      </div>

      <!-- Trial progress moved INSIDE the stimulus-stage box, above the orb
           (was a separate .btn-row above the box). Quit test stays where it
           was, outside the box, alongside the box's top edge. -->
      <div class="btn-row" style="justify-content: flex-end; margin-bottom: 0.5rem;">
        <button class="btn danger">Quit test</button>
      </div>
      <div id="test-content">
        <div class="stimulus-stage" style="height: 320px; position: relative; flex-direction: column; gap: 1rem;">
          <span id="trial-progress" class="field-desc" style="position: absolute; top: 1rem; left: 50%; transform: translateX(-50%);">Trial 2 of 10</span>
          <!-- Orb +20%: 140px -> 168px -->
          <div class="orb" style="width:168px;height:168px;border-radius:50%;background:var(--stimulus-red);"></div>
        </div>
      </div>
      <div class="stage-status" style="text-align:center; margin-top: 0.5rem;">Wait for it…</div>
    </section>

  </main>
</body>
</html>
