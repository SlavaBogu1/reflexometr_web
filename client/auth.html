<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="auth.title">Reflexometr</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="site-nav"></div>

  <main class="container" style="max-width: 420px;">
    <div class="card">
      <h1 id="auth-heading" data-i18n="auth.login.heading">Log in</h1>
      <div class="notice danger" id="auth-error" style="display:none;"></div>

      <div class="field-row" style="flex-direction:column; align-items:stretch; gap:0.3rem;">
        <label for="auth-email" data-i18n="auth.email.label">Email</label>
        <input type="email" id="auth-email" autocomplete="email">
      </div>
      <div class="field-row" style="flex-direction:column; align-items:stretch; gap:0.3rem;">
        <label for="auth-password">
          <span data-i18n="auth.password.label">Password</span>
          <span id="auth-password-hint" class="field-desc" data-i18n="auth.password.hint" style="display:none;"></span>
        </label>
        <input type="password" id="auth-password" autocomplete="current-password">
      </div>

      <div class="btn-row">
        <button class="btn" id="auth-submit" data-i18n="auth.login.submit">Log in</button>
      </div>
      <p><a href="#" id="auth-toggle" data-i18n="auth.toggle_to_register">Don't have an account? Register →</a></p>
    </div>
  </main>

  <script src="js/util.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/locales/en.js"></script>
  <script src="js/locales/es.js"></script>
  <script src="js/locales/de.js"></script>
  <script src="js/locales/fr.js"></script>
  <script src="js/locales/zh-Hans.js"></script>
  <script src="js/settings.js"></script>
  <script src="js/session.js"></script>
  <script src="js/api.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/auth-page.js"></script>
</body>
</html>
