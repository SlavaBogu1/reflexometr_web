<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="home.title">Reflexometr</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="site-nav"></div>

  <main class="hero container">
    <h1 data-i18n="home.hero.h1">How fast are you, really?</h1>
    <p data-i18n="home.hero.p">A single quick check, or a guided path built for your goal — pick what fits.</p>
    <div class="btn-row">
      <a class="btn" href="browse.html" data-i18n="home.hero.cta_primary">Take a test</a>
    </div>
  </main>

  <footer class="site-footer">Reflexometr — Sprint 6 build</footer>

  <script src="js/util.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/locales/en.js"></script>
  <script src="js/locales/es.js"></script>
  <script src="js/locales/de.js"></script>
  <script src="js/locales/fr.js"></script>
  <script src="js/locales/zh-Hans.js"></script>
  <script src="js/locales/ru.js"></script>
  <script src="js/settings.js"></script>
  <script src="js/session.js"></script>
  <script src="js/api.js"></script>
  <script src="js/nav.js"></script>
  <script>
    Reflx.i18n.loadLocaleConfig().then(function () {
      Reflx.i18n.init();
      Reflx.nav.render("home");
      Reflx.i18n.applyToDocument();
    });
    document.addEventListener("reflx:localechange", function () { Reflx.i18n.applyToDocument(); });
  </script>
</body>
</html>
