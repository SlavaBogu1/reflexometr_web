name: Deploy to WebHostMost (sandbox.bogushevich.ru/rtest)

# CR-INFRA-02 — replaces the manual SCP/FTP/SSH copy steps in
# ProductOwner_records/DEPLOYMENT_PLAN.md §§ 2D/2E (now historical — target/paths there predate
# D16) with an automated sync on every push to main. Two independent jobs, gated by path filters,
# so a server-only change never touches the client deploy and vice versa (CR-INFRA-02 acceptance
# criterion 1). A manual workflow_dispatch trigger is always available as a fallback (criterion 4).
#
# --- Path-filter bug fix (2026-09-17) -----------------------------------------------------------
# The original per-job `if: contains(github.event.head_commit.modified, 'server/')` (etc.) never
# actually matched — GitHub Actions' `contains()` on an array checks for an exact element match,
# not a substring/prefix test, and no changed file is ever literally named "server/" or "client/".
# Every push-triggered run silently skipped BOTH jobs (visible only as a 2-second "Skipped" run,
# easy to miss); only manual workflow_dispatch runs ever actually deployed. Replaced with a
# dedicated `changes` job (dorny/paths-filter@v3) that correctly detects per-directory changes and
# feeds `needs.changes.outputs.{server,client}` into each deploy job's `if:`.
#
# --- Required repo secrets (Settings > Secrets and variables > Actions) — SI-6.3 -----------------
# Values are minted/rotated by a human and added directly in GitHub; never committed here or
# anywhere else in the repo (CR-INFRA-02 acceptance criterion 5). Part of MT-04's on-completion
# handoff (ProductOwner_records/MANUAL_TASKS.md).
#
#   DEPLOY_SSH_HOST  - the target host, e.g. sandbox.bogushevich.ru
#   DEPLOY_SSH_USER  - the cPanel/SSH login user
#   DEPLOY_SSH_KEY   - private key (PEM), paired with a public key installed in the account's
#                      ~/.ssh/authorized_keys on the target — never a password
#   DEPLOY_SSH_PORT  - optional; only needed if the host uses a non-default SSH port (defaults to
#                      22 below if the secret is unset)
#   OPCACHE_RESET_TOKEN - HF-01 (CR-TEST-21): random shared secret, compared with hash_equals() by
#                      api/opcache-reset.php. Generated fresh into the deployed script on every
#                      deploy (never committed) so the endpoint can't be triggered by anyone but
#                      this workflow. Set to any long random string in repo secrets once.
#
# --- Target layout (D16, revised 2026-09-17) -------------------------------------------------
# WebHostMost's addon-domain document root is ~/domains/<domain>/public_html/ , NOT ~/ (confirmed
# live after a first deploy attempt landed in the wrong place — the account home directory is
# not served). RTEST_PATH/APP_PATH below (env, defined per-job) hold the real paths.
#
# WebHostMost serves $RTEST_PATH/api/ directly (no separate "docroot vs. app root" concept for
# an addon-domain subdirectory) — it does NOT execute a nested public/index.php the way a local
# `php -S` dev server or a vhost pointed at server/public/ would. So server/public/'s CONTENTS
# (index.php, .htaccess) are deployed directly into $RTEST_PATH/api/ (the web-servable root),
# while everything else (src/, vendor/, database/, storage/, bin/, composer.*) goes into the
# sibling $APP_PATH — one level up, outside any domain's document root, never web-servable. This
# preserves the original public/-split's security intent (vendor/src/db files unreachable by
# direct URL) despite WebHostMost's flatter serving model. The deploy writes app-path.php next to
# index.php, telling it where to find the real app root (server/public/index.php reads that file
# if present; otherwise it assumes the local-repo layout, dirname(__DIR__)).
#   API    -> $RTEST_PATH/api/   (server/public/'s contents — web-servable)
#            $APP_PATH/          (everything else — NOT web-servable)
#   Client -> $RTEST_PATH/       (document root; everything except the api/ subdirectory)
#
# server/.env is provisioned once manually (D3/MT-05) at $APP_PATH/.env and holds live DB
# credentials — deliberately excluded from the server sync payload below and never generated,
# uploaded, or overwritten by this workflow. Config.php's real-env-wins precedent means an
# untouched .env on the target continues to override any bundled defaults.
#
# --- OPcache reset on every deploy (HF-01 / CR-TEST-21, 2026-09-18) -----------------------------
# Root cause of the Two-Hand Reaction Time 500-on-timeout production bug: WebHostMost's LiteSpeed
# PHP runs with OPcache enabled and long-lived worker processes, so uploading new source files does
# not guarantee the running workers execute them (same class of staleness as D22's browser-JS-
# caching finding, just server-side). The Sprint 9 code that reached production was correct on
# disk; some workers kept serving a stale pre-fix compiled version indefinitely. There is no
# assumed shell-level access to restart PHP-FPM/LSAPI on this shared host, so the fix calls
# opcache_reset() from *inside* a PHP request handled by the live web SAPI itself — the only
# mechanism guaranteed to hit the exact OPcache instance serving real traffic, regardless of
# process manager. api/opcache-reset.php is generated fresh (with a random one-time token neither
# committed nor reused) after every server deploy, hit once over HTTPS, and then deleted so it
# never exists as a standing endpoint between deploys.
#
# --- Sync method note (2026-09-17) ------------------------------------------------------------
# rsync is NOT available on the target (confirmed live: `which rsync` finds nothing in this
# cPanel account's PATH — common on shared hosting, no package-install access). Uses
# appleboy/ssh-action to clean stale files via an explicit remote `rm -rf` scoped to known
# subdirectories (never the whole $RTEST_PATH or $APP_PATH root — .env must survive), then
# appleboy/scp-action to copy the new files over. No --delete-style "remove anything not in the
# source" guarantee like rsync had — cleanup here is an explicit, named list, not automatic.

env:
  RTEST_PATH: domains/sandbox.bogushevich.ru/public_html/rtest
  APP_PATH: domains/sandbox.bogushevich.ru/rtest-app

on:
  push:
    branches: [main]
    paths:
      - "server/**"
      - "client/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch: {}

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      server: ${{ steps.filter.outputs.server }}
      client: ${{ steps.filter.outputs.client }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            server:
              - 'server/**'
            client:
              - 'client/**'

  deploy-server:
    name: Deploy server (API)
    needs: changes
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.server == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.1"
          tools: composer:v2

      - name: Install production dependencies
        working-directory: server
        run: composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist

      - name: Remove stale deployed files (never touches .env)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_SSH_HOST }}
          username: ${{ secrets.DEPLOY_SSH_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_SSH_PORT || 22 }}
          script: |
            mkdir -p ~/${{ env.RTEST_PATH }}/api ~/${{ env.APP_PATH }}
            cd ~/${{ env.RTEST_PATH }}/api || exit 1
            rm -f index.php app-path.php
            cd ~/${{ env.APP_PATH }} || exit 1
            rm -rf bin composer.json composer.lock database phpunit.xml public src storage vendor

      - name: Deploy server/ to the non-servable app path
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_SSH_HOST }}
          username: ${{ secrets.DEPLOY_SSH_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_SSH_PORT || 22 }}
          source: "server"
          target: "~/${{ env.APP_PATH }}"
          strip_components: 1
          overwrite: true

      - name: Move public/'s contents to the web-servable API path; clean up + write app-path.php
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_SSH_HOST }}
          username: ${{ secrets.DEPLOY_SSH_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_SSH_PORT || 22 }}
          script: |
            cd ~/${{ env.APP_PATH }} || exit 1
            cp -a public/. ~/${{ env.RTEST_PATH }}/api/
            rm -rf tests CLAUDE.md TASKS.md requirements public
            echo "<?php return '$(pwd)';" > ~/${{ env.RTEST_PATH }}/api/app-path.php

      - name: Write a fresh one-time OPcache reset token (HF-01 / CR-TEST-21)
        env:
          OPCACHE_RESET_TOKEN: ${{ secrets.OPCACHE_RESET_TOKEN }}
        run: |
          if [ -z "$OPCACHE_RESET_TOKEN" ]; then
            echo "::error::OPCACHE_RESET_TOKEN secret is not set — add it (any long random string) in repo Settings > Secrets and re-run. server/public/opcache-reset.php refuses to run without a matching token file, so this is required, not optional."
            exit 1
          fi
          # scp-action runs as a Docker container that only mounts $GITHUB_WORKSPACE
          # (see the working "Deploy server/" step's source: "server" above) — a
          # /tmp file written by this native `run:` step on the runner host is NOT
          # visible inside that container, so the upload silently sourced an empty
          # path ("tar: empty archive"). Write inside the workspace instead.
          echo -n "$OPCACHE_RESET_TOKEN" > "$GITHUB_WORKSPACE/opcache-reset.token"

      - name: Upload the OPcache reset token next to the already-deployed script
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_SSH_HOST }}
          username: ${{ secrets.DEPLOY_SSH_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_SSH_PORT || 22 }}
          source: "opcache-reset.token"
          target: "~/${{ env.RTEST_PATH }}/api"

      - name: Trigger the OPcache reset on the live web SAPI, then remove both files
        env:
          OPCACHE_RESET_TOKEN: ${{ secrets.OPCACHE_RESET_TOKEN }}
        run: |
          status=$(curl -s -o /tmp/opcache_reset_body -w "%{http_code}" "https://${{ secrets.DEPLOY_SSH_HOST }}/rtest/api/opcache-reset.php?token=${OPCACHE_RESET_TOKEN}")
          echo "OPcache reset HTTP status: $status"
          cat /tmp/opcache_reset_body
          echo
          if [ "$status" != "200" ]; then
            echo "::error::OPcache reset request failed (HTTP $status) — live workers may still be serving stale bytecode."
            exit 1
          fi

      - name: Remove the OPcache reset token + script from the live host
        if: always()
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_SSH_HOST }}
          username: ${{ secrets.DEPLOY_SSH_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_SSH_PORT || 22 }}
          script: |
            rm -f ~/${{ env.RTEST_PATH }}/api/opcache-reset.token ~/${{ env.RTEST_PATH }}/api/opcache-reset.php

      - name: Post-deploy health check
        run: |
          status=$(curl -s -o /tmp/health_body -w "%{http_code}" "https://${{ secrets.DEPLOY_SSH_HOST }}/rtest/api/health")
          echo "Health check HTTP status: $status"
          cat /tmp/health_body
          if [ "$status" != "200" ]; then
            echo "::error::Post-deploy health check failed (HTTP $status) — deployed API is not responding correctly."
            exit 1
          fi

  deploy-client:
    name: Deploy client (static files)
    needs: changes
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.client == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Remove stale deployed files (never touches api/ or .env)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_SSH_HOST }}
          username: ${{ secrets.DEPLOY_SSH_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_SSH_PORT || 22 }}
          script: |
            mkdir -p ~/${{ env.RTEST_PATH }}
            cd ~/${{ env.RTEST_PATH }} || exit 1
            find . -maxdepth 1 -mindepth 1 ! -name 'api' -exec rm -rf {} +

      - name: Write build-info.json (CR-INFRA-06 — footer build label, never hand-typed)
        run: |
          sha=$(echo "${{ github.sha }}" | cut -c1-7)
          date=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          printf '{"sha": "%s", "date": "%s"}\n' "$sha" "$date" > client/build-info.json
          cat client/build-info.json

      - name: Deploy client/ to the document root
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_SSH_HOST }}
          username: ${{ secrets.DEPLOY_SSH_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_SSH_PORT || 22 }}
          source: "client"
          target: "~/${{ env.RTEST_PATH }}"
          strip_components: 1
          overwrite: true

      - name: Remove non-deployable paths from the target (docs + design-review prototypes)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_SSH_HOST }}
          username: ${{ secrets.DEPLOY_SSH_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_SSH_PORT || 22 }}
          script: |
            cd ~/${{ env.RTEST_PATH }} || exit 1
            rm -rf CLAUDE.md TASKS.md requirements
            rm -f prototype-*.html

      - name: Post-deploy smoke check
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" "https://${{ secrets.DEPLOY_SSH_HOST }}/rtest/")
          echo "Client root HTTP status: $status"
          if [ "$status" != "200" ]; then
            echo "::error::Post-deploy client smoke check failed (HTTP $status)."
            exit 1
          fi
